# Default gitleaks rules, plus one allowlist: public Solana token-account addresses in exported
# case files and fixtures (the JSON keys "token_account" / "tokenAccount" trip generic-api-key). Nothing else is allowed.
[extend]
useDefault = true

[[allowlists]]
description = "Solana token account addresses (public on-chain data)"
regexTarget = "match"
regexes = [
  '''token_account"\s*:\s*"[1-9A-HJ-NP-Za-km-z]{32,44}"''',
  '''tokenAccount"\s*:\s*"[1-9A-HJ-NP-Za-km-z]{32,44}"''',
]
